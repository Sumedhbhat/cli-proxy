name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
  ledger:
    # The usage-ledger plugin, built from source and exercised inside the
    # pinned CLIProxyAPI release against a local mock provider.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Plugin unit tests
        working-directory: engine-plugin
        run: |
          test -z "$(gofmt -l .)"
          CGO_ENABLED=1 go test ./...
      - run: npm run plugin:build
      - name: Download the pinned engine release
        run: |
          set -euo pipefail
          asset=CLIProxyAPI_8.0.59_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/router-for-me/CLIProxyAPI/releases/download/v8.0.59/$asset"
          echo "5427e41344a8d57519156ae12b01654c2aef36ced39f493e327362e15627e34c  $asset" | sha256sum -c
          mkdir -p engine && tar -xzf "$asset" -C engine
      - run: npm run test:engine
        env:
          CLI_PROXY_ENGINE_BINARY: engine/cli-proxy-api
